<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <meta name="description" content="A 9-photo grid arranged in 3 rows and 3 columns with equal dimensions, placeholder images, and titles." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1rem;
      }

      .gallery-wrapper {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }

      .gallery-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .gallery-header h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #ffffff;
        margin-bottom: 0.5rem;
      }

      .gallery-header p {
        font-size: 0.95rem;
        color: #94a3b8;
      }

      /* 3 rows, 3 columns grid with equal dimensions */
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 1.25rem;
        width: 100%;
      }

      .photo-card {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .photo-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.5);
        border-color: #475569;
      }

      /* Equal dimension square aspect ratio for every photo container */
      .image-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background-color: #090d16;
        position: relative;
      }

      .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .photo-card:hover img {
        transform: scale(1.05);
      }

      .photo-details {
        padding: 0.85rem 1rem;
        text-align: center;
        background-color: #1e293b;
        border-top: 1px solid #334155;
      }

      .photo-title {
        font-size: 0.925rem;
        font-weight: 600;
        color: #f1f5f9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (max-width: 640px) {
        .photo-grid {
          gap: 0.75rem;
        }

        .gallery-header h1 {
          font-size: 1.5rem;
        }

        .photo-details {
          padding: 0.5rem 0.6rem;
        }

        .photo-title {
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="gallery-wrapper">
      <header class="gallery-header">
        <h1>Photo Gallery</h1>
        <p>A 3&times;3 photographic collection with equal dimensions</p>
      </header>

      <main class="photo-grid">
        <!-- Row 1 / Col 1 -->
        <div class="photo-card" id="photo-1">
          <div class="image-container">
            <img src="./images/usa_today_10378433.jpg" alt="Sports Feature" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Sports Feature</h2>
          </div>
        </div>

        <!-- Row 1 / Col 2 -->
        <div class="photo-card" id="photo-2">
          <div class="image-container">
            <img src="https://picsum.photos/id/16/600/600" alt="Serene Ocean Pier" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Ocean Pier</h2>
          </div>
        </div>

        <!-- Row 1 / Col 3 -->
        <div class="photo-card" id="photo-3">
          <div class="image-container">
            <img src="https://picsum.photos/id/28/600/600" alt="Misty Forest Trail" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Forest Trail</h2>
          </div>
        </div>

        <!-- Row 2 / Col 1 -->
        <div class="photo-card" id="photo-4">
          <div class="image-container">
            <img src="https://picsum.photos/id/29/600/600" alt="Rocky Mountain Peak" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Mountain Peak</h2>
          </div>
        </div>

        <!-- Row 2 / Col 2 -->
        <div class="photo-card" id="photo-5">
          <div class="image-container">
            <img src="https://picsum.photos/id/42/600/600" alt="Abstract Coffee Cup" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Morning Brew</h2>
          </div>
        </div>

        <!-- Row 2 / Col 3 -->
        <div class="photo-card" id="photo-6">
          <div class="image-container">
            <img src="https://picsum.photos/id/48/600/600" alt="Golden Autumn Bridge" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Autumn Bridge</h2>
          </div>
        </div>

        <!-- Row 3 / Col 1 -->
        <div class="photo-card" id="photo-7">
          <div class="image-container">
            <img src="https://picsum.photos/id/54/600/600" alt="Coastal Waves" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Coastal Waves</h2>
          </div>
        </div>

        <!-- Row 3 / Col 2 -->
        <div class="photo-card" id="photo-8">
          <div class="image-container">
            <img src="https://picsum.photos/id/57/600/600" alt="Modern Architecture" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Urban Geometry</h2>
          </div>
        </div>

        <!-- Row 3 / Col 3 -->
        <div class="photo-card" id="photo-9">
          <div class="image-container">
            <img src="https://picsum.photos/id/65/600/600" alt="Golden Desert Dunes" loading="lazy" />
          </div>
          <div class="photo-details">
            <h2 class="photo-title">Desert Dunes</h2>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
